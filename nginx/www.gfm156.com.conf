# HTTP -> HTTPS 重定向
server
{
    listen 80;
    listen 32;
    server_name 115.191.68.122 www.gfm156.com gfm156.com;

    # Let's Encrypt 证书续期
    location ~ \.well-known/acme-challenge {
        root /www/wwwroot/www.gfm156.com;
        allow all;
    }

    # 其他请求全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server
{
    listen 443 ssl;
    server_name www.gfm156.com gfm156.com;

    # SSL 证书 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/gfm156.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gfm156.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.html;
    root /www/wwwroot/www.gfm156.com;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/www.gfm156.com.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/www.gfm156.com/*.conf;

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #ERROR-PAGE-END

    # SPA 路由支持 - 个人网站
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Temporary private writing entry while write.gfm156.com DNS / TLS are not ready.
    location = /write {
        if ($host = www.gfm156.com) {
            return 301 https://gfm156.com/write/;
        }

        return 302 /write/;
    }

    location = /write/api {
        if ($host = www.gfm156.com) {
            return 301 https://gfm156.com/write/api;
        }

        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/write.gfm156.com/api/index.php;
        fastcgi_param SCRIPT_NAME /write/api/index.php;
        fastcgi_param DOCUMENT_ROOT /www/wwwroot/write.gfm156.com;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }

    location ^~ /write/api/ {
        if ($host = www.gfm156.com) {
            rewrite ^/write/api/(.*)$ https://gfm156.com/write/api/$1 permanent;
        }

        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/write.gfm156.com/api/index.php;
        fastcgi_param SCRIPT_NAME /write/api/index.php;
        fastcgi_param DOCUMENT_ROOT /www/wwwroot/write.gfm156.com;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }

    location ^~ /write/ {
        if ($host = www.gfm156.com) {
            rewrite ^/write/(.*)$ https://gfm156.com/write/$1 permanent;
        }

        try_files $uri $uri/ /write/index.html;
    }

    # Blog runtime JSON lives outside dist so normal frontend deploys do not overwrite it.
    location ^~ /blog-runtime/ {
        alias /www/wwwdata/blog-runtime/;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Published blog assets are served from the source storage directory.
    location ^~ /blog-assets/ {
        alias /www/wwwdata/blog-source/assets/;
        expires 30d;
        try_files $uri =404;
    }

    # Strategy ???? (Streamlit on 8501)
    # baseUrlPath ???? /strategy???????????
    location = /strategy {
        return 302 /strategy/$is_args$args;
    }

    location ^~ /strategy/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_redirect off;
    }

    # Predictor 项目代理 (Streamlit on 8503)
    location = /predictor {
        return 302 /predictor/;
    }

    location ^~ /predictor/ {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_redirect off;
    }

    # 禁止访问的敏感文件
    location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env.*|\.DS_Store|\.gitignore)$ {
        return 404;
    }

    location ~* /(\.git|\.svn|\.vscode|node_modules)/ {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|svg)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log /www/wwwlogs/www.gfm156.com.log;
    error_log /www/wwwlogs/www.gfm156.com.error.log;
}
