# HTTP -> HTTPS 重定向
server
{
    listen 80;
    listen 32;
    server_name 115.191.68.122 www.gfm156.com gfm156.com;

    location ~ \.well-known/acme-challenge {
        root /www/wwwroot/www.gfm156.com;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server
{
    listen 443 ssl;
    server_name www.gfm156.com gfm156.com;

    ssl_certificate /etc/letsencrypt/live/gfm156.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gfm156.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    index index.html;
    root /www/wwwroot/www.gfm156.com;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/www.gfm156.com.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/www.gfm156.com/*.conf;

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #ERROR-PAGE-END

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Legacy /write paths now canonicalize to the dedicated admin subdomain.
    location = /write {
        return 301 https://write.gfm156.com/;
    }

    location = /write/ {
        return 301 https://write.gfm156.com/;
    }

    location = /write/api {
        return 301 https://write.gfm156.com/api;
    }

    location ^~ /write/api/ {
        rewrite ^/write/api/(.*)$ https://write.gfm156.com/api/$1 permanent;
    }

    location ^~ /write/ {
        rewrite ^/write/(.*)$ https://write.gfm156.com/$1 permanent;
    }

    location ^~ /blog-runtime/ {
        alias /www/wwwdata/blog-runtime/;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location ^~ /blog-assets/ {
        alias /www/wwwdata/blog-source/assets/;
        expires 30d;
        try_files $uri =404;
    }

    location ^~ /strategy/ {
        proxy_pass http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env.*|\.DS_Store|\.gitignore)$ {
        return 404;
    }

    location ~* /(\.git|\.svn|\.vscode|node_modules)/ {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|svg)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log /www/wwwlogs/www.gfm156.com.log;
    error_log /www/wwwlogs/www.gfm156.com.error.log;
}
