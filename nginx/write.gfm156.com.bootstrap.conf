server
{
    listen 80;
    server_name write.gfm156.com;

    index index.html;
    root /www/wwwroot/write.gfm156.com;

    include /www/server/panel/vhost/nginx/well-known/write.gfm156.com.conf;
    include /www/server/panel/vhost/nginx/extension/write.gfm156.com/*.conf;

    location ~ \.well-known/acme-challenge {
        root /www/wwwroot/write.gfm156.com;
        allow all;
    }

    location ^~ /api/ {
        try_files $uri /api/index.php?$query_string;
    }

    location = /api {
        rewrite ^ /api/index.php last;
    }

    # HTTP-only bootstrap vhost used before the certificate is issued.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }

    location ^~ /blog-assets/ {
        alias /www/wwwdata/blog-source/assets/;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* (\.user\.ini|\.htaccess|\.htpasswd|\.env.*|\.DS_Store|\.gitignore)$ {
        return 404;
    }

    location ~* /(\.git|\.svn|\.vscode|node_modules)/ {
        return 404;
    }
}
